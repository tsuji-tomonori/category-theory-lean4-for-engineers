name: Bootstrap Lean command outputs

on:
  push:
    branches:
      - agent/sync-lean-command-outputs

permissions:
  contents: write

concurrency:
  group: bootstrap-lean-command-outputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: |
          lake update mathlib
          lake exe cache get

      - name: Generate command output comments
        run: python3 tools/sync_lean_command_outputs.py

      - name: Validate generated diff
        run: git diff --check -- chapters lean

      - name: Commit generated comments
        run: |
          git add chapters lean
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "📝 docs(lean): 実行結果コメントを生成"
          git push origin "HEAD:${GITHUB_REF_NAME}"
